# 매일 개발 기록 초안 — 매일 09:00(KST) 에 어제 작업한 커밋으로 글 초안을 만들어 PR 로 올린다.
# 바로 게시하지 않는다. PR 을 읽고 고친 뒤 머지하면 deploy.yml 이 게시한다.
#
# 필요한 저장소 Secrets:
#   ANTHROPIC_API_KEY       (필수) Claude API 키
#   DEVLOG_AUTHOR_EMAILS    (선택) 계정에 연결되지 않은 내 커밋 이메일, 쉼표 구분
#   DEVLOG_REDACT_WORDS     (선택) 글에서 지울 회사·고객·사람 이름, 쉼표 구분
#   DEVLOG_GITHUB_TOKEN     (선택) 비공개 저장소까지 읽을 토큰. devlog.config.json 의 includePrivate 와 함께 쓴다
name: Daily devlog draft

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "기록할 날짜 (YYYY-MM-DD, 비우면 어제)"
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: daily-draft
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: 민감정보 필터 시험
        run: npm run test:sanitize

      - name: 초안 만들기
        id: draft
        env:
          INPUT_DATE: ${{ inputs.date }}
          GITHUB_TOKEN: ${{ secrets.DEVLOG_GITHUB_TOKEN || github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEVLOG_AUTHOR_EMAILS: ${{ secrets.DEVLOG_AUTHOR_EMAILS }}
          DEVLOG_REDACT_WORDS: ${{ secrets.DEVLOG_REDACT_WORDS }}
        run: |
          if [ -n "$INPUT_DATE" ]; then
            node scripts/devlog/daily-draft.mjs --date "$INPUT_DATE"
          else
            node scripts/devlog/daily-draft.mjs
          fi

      - name: 빌드 확인
        if: steps.draft.outputs.created == 'true'
        run: npm run build

      - name: PR 올리기
        if: steps.draft.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT_DATE: ${{ steps.draft.outputs.date }}
          DRAFT_TITLE: ${{ steps.draft.outputs.title }}
        run: |
          branch="devlog/$DRAFT_DATE"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "$branch 브랜치가 이미 있습니다. 건너뜁니다."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add "src/content/posts/devlog-$DRAFT_DATE.md"
          git commit -m "devlog: $DRAFT_DATE 초안"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "devlog: $DRAFT_DATE · $DRAFT_TITLE" \
            --body-file .devlog-out/pr-body.md
