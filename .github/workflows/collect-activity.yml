# 매일 작업 내역 수집 — 매일 08:00 KST 에 최근 3일(KST) 의 공개 저장소 커밋을 모아 devlog-data 브랜치에 저장한다.
# 클라우드 루틴은 블로그 저장소 밖의 GitHub API 를 못 부르므로, 수집은 여기서 하고 루틴은 이 브랜치의 파일로 글만 쓴다.
#
#   devlog-data 브랜치/activity/YYYY-MM-DD.json  작업이 있었던 날 (걸러 낸 activity + meta)
#   devlog-data 브랜치/activity/YYYY-MM-DD.none  작업이 없었던 날
#
# 필요하면 저장소 Secrets 에 DEVLOG_AUTHOR_EMAILS(계정에 연결 안 된 커밋 이메일), DEVLOG_REDACT_WORDS 를 넣는다.
name: Collect devlog activity

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "수집할 날짜 (YYYY-MM-DD, 비우면 최근 3일)"
        required: false

permissions:
  contents: write

concurrency:
  group: collect-activity
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: 수집
        env:
          INPUT_DATE: ${{ inputs.date }}
          GITHUB_TOKEN: ${{ github.token }}
          DEVLOG_AUTHOR_EMAILS: ${{ secrets.DEVLOG_AUTHOR_EMAILS }}
          DEVLOG_REDACT_WORDS: ${{ secrets.DEVLOG_REDACT_WORDS }}
        run: |
          mkdir -p /tmp/activity
          if [ -n "$INPUT_DATE" ]; then
            dates="$INPUT_DATE"
          else
            dates=$(for n in 3 2 1; do TZ=Asia/Seoul date -d "-$n day" +%F; done)
          fi
          for d in $dates; do
            out=$(node scripts/devlog/daily-draft.mjs --collect --date "$d")
            echo "$out"
            case "$out" in
              *status=COLLECTED*) cp ".devlog-out/$d/activity.json" "/tmp/activity/$d.json" ;;
              *status=NO_ACTIVITY*) : > "/tmp/activity/$d.none" ;;
            esac
          done

      - name: devlog-data 브랜치에 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin devlog-data >/dev/null; then
            git fetch origin devlog-data
            git switch devlog-data
          else
            git switch --orphan devlog-data
            git rm -rf --quiet . || true
            printf '# devlog-data\n\n매일 수집한 작업 내역. Collect devlog activity 워크플로가 쓰고 클라우드 루틴이 읽는다.\n' > README.md
            git add README.md
          fi
          mkdir -p activity
          cp /tmp/activity/* activity/ 2>/dev/null || true
          git add activity README.md 2>/dev/null || git add activity
          if git diff --cached --quiet; then
            echo "바뀐 것 없음"
          else
            git commit -q -m "activity: $(ls /tmp/activity | tr '\n' ' ')"
            git push origin devlog-data
          fi
